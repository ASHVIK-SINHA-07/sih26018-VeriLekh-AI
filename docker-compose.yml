# The whole system: database, text recognition, and the application.
#
#   docker compose up -d
#
# That is the entire installation. Nothing else needs to be present on the
# machine except Docker itself — no Node, no Python, no Tesseract. Nothing in
# here reaches the public internet once the images are built.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_local_dev}
      POSTGRES_DB: landrecords
    # Bound to loopback only. The application reaches the database over the
    # internal compose network, so nothing outside this machine ever needs a
    # route to Postgres — publishing it to 0.0.0.0 would expose the database
    # to every host on the department LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d landrecords"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted OCR. Language models are installed into the image at build
  # time, so this container never needs network access at runtime.
  ocr:
    build: ./ocr-service
    restart: unless-stopped
    # Loopback only, for the same reason as the database: the application
    # calls this over the internal network at http://ocr:8000.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      UPLOAD_ROOT: /data
    volumes:
      - ./uploads:/data/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    # Loopback only. Staff reach the system through the proxy on 443; this
    # mapping exists so a developer can hit the app directly on the server.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Inside the compose network the other services are reached by name,
      # not localhost — these override anything in .env.
      DATABASE_URL: postgresql://sih:${POSTGRES_PASSWORD:-sih_local_dev}@db:5432/landrecords
      OCR_SERVICE_URL: http://ocr:8000
      UPLOAD_DIR: ./uploads
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env - generate one with openssl rand -base64 32}"
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    volumes:
      # Scans are written here by the app and read by the OCR service. Bound to
      # the host so a department can back them up with its existing tooling.
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started

  # Drains the extraction queue. Runs the same image as the application but
  # a different command, so it shares the code and the database connection
  # without a second build. Scale it with `docker compose up -d --scale
  # worker=3` — SKIP LOCKED means the copies never collide.
  worker:
    build: .
    restart: unless-stopped
    command: node --import ./scripts/register-hooks.mjs src/worker.ts
    environment:
      DATABASE_URL: postgresql://sih:${POSTGRES_PASSWORD:-sih_local_dev}@db:5432/landrecords
      OCR_SERVICE_URL: http://ocr:8000
      UPLOAD_DIR: ./uploads
      NODE_ENV: production
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started

  # TLS termination and the only service exposed to the network.
  # Obtains and renews certificates automatically — a real one for a public
  # hostname, its own for a closed department network.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddydata:
  caddyconfig:
